name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    name: PyTest (Python ${{ matrix.python-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Uv
        working-directory: testing
        run: |
          pip install uv==0.13.5
          uv sync

      - name: Run Python Tests
        working-directory: testing
        run: uv run -m pytest

  generate_package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    name: Generate Package (Python ${{ matrix.python-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Generate Python package
        run: |
          rm -Rf .git/
          uvx copier copy . ./generated/ \
            --quiet \
            --data ci="github" \
            --data repository_url="https://github.com/lukin0110/mcfly/" \
            --data name="McFly" \
            --data description="A package used in tests to test a scaffolded python package" \
            --data package_type="package" \
            --data use_pydantic=yes \
            --data use_makefile=no \
            --data use_claude=yes \
            --data python_version="${{ matrix.python-version }}" \
            --data package_slug="mcfly"

      - name: Prepare package
        working-directory: generated
        run: |
          git init
          git add .
          uv lock

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build the dev stage of the generated Dockerfile, cached in the GitHub Actions cache.
      # https://github.com/docker/build-push-action
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: generated
          target: dev
          tags: mcfly-dev
          load: true
          build-args: PYTHON_VERSION=${{ matrix.python-version }}
          cache-from: type=gha,scope=package-${{ matrix.python-version }}
          cache-to: type=gha,mode=max,scope=package-${{ matrix.python-version }}

      # Mount the generated package over the workdir: lint needs .git.
      - name: Lint package
        working-directory: generated
        run: docker run --rm -v "$PWD:/workspaces/mcfly" mcfly-dev poe lint

      - name: Test package
        working-directory: generated
        run: docker run --rm -v "$PWD:/workspaces/mcfly" mcfly-dev poe test

  generate_fastapi:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    name: Generate FastAPI app (Python ${{ matrix.python-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Generate FastAPI app
        run: |
          rm -Rf .git/
          uvx copier copy . ./generated/ \
            --quiet \
            --data ci="github" \
            --data repository_url="https://github.com/lukin0110/mcfly-api/" \
            --data name="McFly API" \
            --data description="A package used in tests to test a scaffolded FastAPI app" \
            --data package_type="fastapi" \
            --data use_pydantic=yes \
            --data use_makefile=no \
            --data use_claude=no \
            --data python_version="${{ matrix.python-version }}" \
            --data package_slug="mcfly"

      - name: Prepare package
        working-directory: generated
        run: |
          git init
          git add .
          uv lock

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build the dev stage of the generated Dockerfile, cached in the GitHub Actions cache.
      # https://github.com/docker/build-push-action
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: generated
          target: dev
          tags: mcfly-dev
          load: true
          build-args: PYTHON_VERSION=${{ matrix.python-version }}
          cache-from: type=gha,scope=fastapi-${{ matrix.python-version }}
          cache-to: type=gha,mode=max,scope=fastapi-${{ matrix.python-version }}

      # Mount the generated package over the workdir: lint needs .git.
      - name: Lint package
        working-directory: generated
        run: docker run --rm -v "$PWD:/workspaces/mcfly" mcfly-dev poe lint

      - name: Test package
        working-directory: generated
        run: docker run --rm -v "$PWD:/workspaces/mcfly" mcfly-dev poe test
